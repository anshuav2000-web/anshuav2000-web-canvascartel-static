# --- Basic nginx config for SPA ---
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-font-ttf
        application/x-font-opentype
        image/svg+xml
        image/x-icon;

    # Max-favicon cache
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Sitemap and robots cache
    location = /sitemap.xml {
        access_log off;
        log_not_found off;
        expires 1d;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        expires 1d;
    }

    # Default cache
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
